spring.application.name=api

# Configuração do banco de dados H2 (em arquivo, dentro do projeto)
spring.datasource.url=jdbc:h2:file:./DATA/oficina
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ver os comandos SQL no log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave secreta para assinar os tokens JWT: lida da variável de ambiente JWT_SECRET
# (o valor padrão serve só para rodar localmente)
pw3.senha.principal.geracao.token=${JWT_SECRET:12345678}
